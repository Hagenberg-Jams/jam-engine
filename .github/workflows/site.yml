# Reusable workflow for jam sites. Validates and builds the site, then deploys it to Cloudflare Pages:
# to production on main, on a schedule and when started manually, and as a preview for pull requests.
name: Jam site

on:
  workflow_call:
    inputs:
      project-name:
        description: Name of the Cloudflare Pages project
        required: true
        type: string
      site-url:
        description: Public URL of the site
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      JAM_TOPIC:
        required: false
      JAM_TOPIC_VIDEO:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      SITE_URL: ${{ inputs.site-url }}
      JAM_WEBSITE: ${{ inputs.site-url }}
      GAMES_BASE_URL: ${{ vars.GAMES_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      - run: npm ci
      - run: php hyde jam:validate
      - run: npm run build

      # The secrets are only used here for the first build after the release.
      # Before that, the engine leaves them out of the page.
      - run: php hyde build --no-interaction
        env:
          JAM_TOPIC: ${{ secrets.JAM_TOPIC }}
          JAM_TOPIC_VIDEO: ${{ secrets.JAM_TOPIC_VIDEO }}

      - run: php hyde jam:check-links

      - name: Check that deployments are configured
        id: deploy
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "::notice::No Cloudflare token, skipping the deployment."; fi

      - name: Create the Pages project if needed
        if: steps.deploy.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.project-name }}
        run: |
          npx --yes wrangler@4 pages project list | grep -q " $PROJECT " || npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main

      - name: Transfer the topic to Cloudflare
        if: steps.deploy.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.project-name }}
          JAM_TOPIC: ${{ secrets.JAM_TOPIC }}
          JAM_TOPIC_VIDEO: ${{ secrets.JAM_TOPIC_VIDEO }}
        run: |
          if [ -n "$JAM_TOPIC" ]; then printf '%s' "$JAM_TOPIC" | npx --yes wrangler@4 pages secret put JAM_TOPIC --project-name="$PROJECT"; fi
          if [ -n "$JAM_TOPIC_VIDEO" ]; then printf '%s' "$JAM_TOPIC_VIDEO" | npx --yes wrangler@4 pages secret put JAM_TOPIC_VIDEO --project-name="$PROJECT"; fi

      - name: Deploy
        if: steps.deploy.outputs.enabled == 'true'
        id: wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.project-name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npx --yes wrangler@4 pages deploy _site --project-name="$PROJECT" --branch="$BRANCH" | tee deploy.log
          echo "url=$(grep -oE 'https://[^ ]+\.pages\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Link the preview in the pull request
        if: steps.deploy.outputs.enabled == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.wrangler.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Preview of this pull request: $URL"
