# Reusable workflow for jam sites. Validates and builds the site, then deploys it to Cloudflare Pages:
# to production on main, on a schedule and when started manually, and as a preview for pull requests.
name: Jam site

on:
  workflow_call:
    inputs:
      project-name:
        description: Name of the Cloudflare Pages project
        required: true
        type: string
      site-url:
        description: Public URL of the site
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      JAM_TOPIC:
        required: false
      JAM_TOPIC_VIDEO:
        required: false
      TURNSTILE_SECRET:
        required: false
      EMAIL_API_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      SITE_URL: ${{ inputs.site-url }}
      JAM_WEBSITE: ${{ inputs.site-url }}
      GAMES_BASE_URL: ${{ vars.GAMES_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      - run: npm ci
      - run: php hyde jam:validate
      - run: npm run build

      # The secrets are only used here for the first build after the release.
      # Before that, the engine leaves them out of the page.
      - run: php hyde build --no-interaction
        env:
          JAM_TOPIC: ${{ secrets.JAM_TOPIC }}
          JAM_TOPIC_VIDEO: ${{ secrets.JAM_TOPIC_VIDEO }}

      - run: php hyde jam:check-links

      - name: Check that deployments are configured
        id: deploy
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "::notice::No Cloudflare token, skipping the deployment."; fi

      - name: Create the Pages project if needed
        if: steps.deploy.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.project-name }}
        run: |
          npx --yes wrangler@4 pages project list | grep -q " $PROJECT " || npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main

      # Only when the registration form is on. It runs before the topic step, so that the topic secret
      # is uploaded last, whatever the API does with existing variables.
      - name: Set up the registration database
        if: steps.deploy.outputs.enabled == 'true' && hashFiles('functions/api/_registration-config.json') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.project-name }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          EMAIL_API_TOKEN: ${{ secrets.EMAIL_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          migrations="$PWD/vendor/hagenberg-jams/jam-engine/resources/registration/migrations"
          now="CAST(strftime('%s', 'now') AS INTEGER) * 1000"
          ids=()

          # One database for production and one for previews, so that test registrations stay apart.
          for suffix in "" "-preview"; do
            name="$PROJECT-registrations$suffix"
            id=$(curl -fsS "${auth[@]}" "$api/d1/database?name=$name" | jq -r --arg name "$name" '[.result[] | select(.name == $name)][0].uuid // empty')
            if [ -z "$id" ]; then
              id=$(curl -fsS "${auth[@]}" -X POST "$api/d1/database" -d "$(jq -n --arg name "$name" '{name: $name}')" | jq -r .result.uuid)
            fi

            dir="$RUNNER_TEMP/d1$suffix"
            mkdir -p "$dir"
            {
              echo "name = \"$PROJECT\""
              echo "[[d1_databases]]"
              echo "binding = \"JAM_DB\""
              echo "database_name = \"$name\""
              echo "database_id = \"$id\""
              echo "migrations_dir = \"$migrations\""
            } > "$dir/wrangler.toml"
            (cd "$dir" && npx --yes wrangler@4 d1 migrations apply "$name" --remote)

            # Deletes registrations whose retention time is over.
            purge="DELETE FROM members WHERE registration_id IN (SELECT id FROM registrations WHERE purge_after < $now);"
            purge="$purge DELETE FROM registrations WHERE purge_after < $now;"
            (cd "$dir" && npx --yes wrangler@4 d1 execute "$name" --remote --command "$purge")
            ids+=("$id")
          done

          body=$(jq -n --arg production "${ids[0]}" --arg preview "${ids[1]}" --arg account "$CLOUDFLARE_ACCOUNT_ID" \
            --arg turnstile "$TURNSTILE_SECRET" --arg mail "$EMAIL_API_TOKEN" '
            def secret($name; $value): if $value == "" then {} else {($name): {type: "secret_text", value: $value}} end;
            def environment($db): {
              d1_databases: {JAM_DB: {id: $db}},
              env_vars: ({CF_ACCOUNT_ID: {type: "plain_text", value: $account}}
                + secret("TURNSTILE_SECRET"; $turnstile) + secret("EMAIL_API_TOKEN"; $mail))
            };
            {deployment_configs: {production: environment($production), preview: environment($preview)}}')
          curl -fsS "${auth[@]}" -X PATCH "$api/pages/projects/$PROJECT" -d "$body" > /dev/null
          if [ -z "$EMAIL_API_TOKEN" ]; then echo "::warning::EMAIL_API_TOKEN is not set, so the registration sends no mails."; fi
          if [ -z "$TURNSTILE_SECRET" ]; then echo "::warning::TURNSTILE_SECRET is not set, so every registration fails the spam check."; fi

      - name: Transfer the topic to Cloudflare
        if: steps.deploy.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.project-name }}
          JAM_TOPIC: ${{ secrets.JAM_TOPIC }}
          JAM_TOPIC_VIDEO: ${{ secrets.JAM_TOPIC_VIDEO }}
        # One secret with the year of the jam, so that topic and video are replaced together
        # and a secret left over from an earlier jam is never shown.
        run: |
          if [ -z "$JAM_TOPIC" ]; then exit 0; fi
          if [ ! -f functions/api/_topic-config.json ]; then echo "::warning::JAM_TOPIC is set, but no jam has a topic release."; exit 0; fi
          node -e 'const { year } = require("./functions/api/_topic-config.json"); process.stdout.write(JSON.stringify({ year, topic: process.env.JAM_TOPIC, video: process.env.JAM_TOPIC_VIDEO || null }))'             | npx --yes wrangler@4 pages secret put JAM_TOPIC_DATA --project-name="$PROJECT"

      - name: Deploy
        if: steps.deploy.outputs.enabled == 'true'
        id: wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.project-name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npx --yes wrangler@4 pages deploy _site --project-name="$PROJECT" --branch="$BRANCH" | tee deploy.log
          echo "url=$(grep -oE 'https://[^ ]+\.pages\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Link the preview in the pull request
        if: steps.deploy.outputs.enabled == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.wrangler.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Preview of this pull request: $URL"
