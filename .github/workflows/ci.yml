name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo
          coverage: none
      - name: Install ImageMagick for the image commands
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp
          magick -version || echo "::notice::magick is not available, so the jam:add-project test is skipped."
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer analyse
      - run: vendor/bin/pest

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
